<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools - AgentCopilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    body { font-family: Inter, sans-serif; }
    .ai-panel { max-width: 900px; margin: 24px auto; padding: 24px; background: #18181B; border: 1px solid #27272A; border-radius: 14px; }
    .ai-panel h2 { margin-top: 0; }
    .ai-form { display: grid; gap: 14px; }
    .ai-form input, .ai-form textarea { width: 100%; box-sizing: border-box; padding: 13px; border-radius: 8px; background: #09090B; border: 1px solid #3F3F46; color: #FAFAFA; font: inherit; }
    .ai-form button { padding: 13px 18px; border: 0; border-radius: 8px; background: #10B981; color: #052E24; font-weight: 700; cursor: pointer; }
    .ai-form button:disabled { opacity: .6; cursor: wait; }
    #ai-output { display: none; margin-top: 20px; padding: 18px; border: 1px solid #10B981; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
    .api-note { color: #A1A1AA; font-size: .85rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container"><span class="logo-text">AgentCopilot</span></div>
      <nav class="nav-menu">
        <a href="./index.html" class="nav-item">Dashboard</a>
        <a href="./leads.html" class="nav-item">CRM Leads</a>
        <a href="./ai-tools.html" class="nav-item active">AI Tools</a>
        <a href="./admin.html" class="nav-item">Admin Panel</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-navbar">
        <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>
        <div class="user-profile"><span class="avatar">AC</span></div>
      </header>
      <section class="dashboard-content">
        <div class="welcome-section">
          <p class="date">AI WORKSPACE</p>
          <h1>AI Tools</h1>
          <p class="subtitle">Generate professional property listings with AI.</p>
        </div>
        <section class="ai-panel">
          <h2>Listing Writer</h2>
          <form class="ai-form" id="listing-form">
            <input id="address" type="text" placeholder="Property address" autocomplete="street-address">
            <input id="details" type="text" placeholder="Beds, baths, square footage">
            <textarea id="features" rows="4" placeholder="Key features (pool, ocean view, renovated kitchen...)"></textarea>
            <button id="generate-btn" type="submit">Generate Listing</button>
          </form>
          <p class="api-note">Your API key stays on the backend and is never placed in this page.</p>
          <div id="ai-output" role="status" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </div>
  <script>
    // Set this to your deployed backend origin after deploying the Render service.
    window.AGENTCOPILOT_API_URL = window.AGENTCOPILOT_API_URL || 'https://YOUR-RENDER-SERVICE.onrender.com';

    const form = document.getElementById('listing-form');
    const button = document.getElementById('generate-btn');
    const output = document.getElementById('ai-output');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const address = document.getElementById('address').value.trim() || 'a property';
      const details = document.getElementById('details').value.trim() || 'details not provided';
      const features = document.getElementById('features').value.trim() || 'features not provided';

      button.disabled = true;
      button.textContent = 'Generating...';
      output.style.display = 'none';

      try {
        const response = await fetch(window.AGENTCOPILOT_API_URL + '/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: `Write a professional, accurate real estate listing for ${address}. Property details: ${details}. Key features: ${features}. Use an appealing but factual tone and do not invent amenities or facts.`
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Backend request failed (${response.status})`);
        if (!data.result) throw new Error('The AI returned an empty response.');
        output.textContent = data.result;
        output.style.display = 'block';
      } catch (error) {
        output.textContent = error.message || 'Unable to reach the AI service.';
        output.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Generate Listing';
      }
    });
  </script>
  <script type="module" src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools - AgentCopilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon"><i data-lucide="home"></i></div>
                <span class="logo-text">AgentCopilot</span>
            </div>
            <nav class="nav-menu">
                <a href="./index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="./leads.html" class="nav-item"><i data-lucide="users"></i> CRM Leads</a>
                <a href="./ai-tools.html" class="nav-item active"><i data-lucide="sparkles"></i> AI Tools</a>
                <a href="./admin.html" class="nav-item"><i data-lucide="shield-check"></i> Admin Panel</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="menu-toggle"><i data-lucide="menu"></i></div>
                <div class="user-profile">
                    <i data-lucide="bell" class="notification-icon"></i>
                    <div class="avatar">JE</div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="welcome-section">
                    <p class="date">AI WORKSPACE</p>
                    <h1>AI Tools</h1>
                    <p class="subtitle">Generate listings and draft emails instantly.</p>
                </div>

                <div class="table-container">
                    <h2>Listing Writer</h2>
                    <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">

<input type="text" id="address" placeholder="Property Address" style="padding: 12px; border-radius: 8px; background: #09090B; border: 1px solid #27272A; color: white;">
<input type="text" id="details" placeholder="Beds, Baths, Square Footage" style="padding: 12px; border-radius: 8px; background: #09090B; border: 1px solid #27272A; color: white;">
<textarea id="features" placeholder="Key Features (e.g., pool, ocean view, newly renovated)" rows="4" style="padding: 12px; border-radius: 8px; background: #09090B; border: 1px solid #27272A; color: white;"></textarea>
<button id="generate-btn" style="padding: 12px; border-radius: 8px; background: var(--accent); color: black; font-weight: 600; border: none; cursor: pointer;">Generate Listing</button>
<div id="ai-output" style="display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background: #09090B; border: 1px solid var(--accent); color: #FAFAFA; font-size: 0.9rem; line-height: 1.5;"></div>
                        
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Mobile Menu Logic
        const menuToggle = document.querySelector('.menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('show-mobile');
            });
        }

        // Real AI Generation Logic
        const generateBtn = document.getElementById('generate-btn');
        const outputBox = document.getElementById('ai-output');

        generateBtn.addEventListener('click', async () => {
            const address = document.getElementById('address').value || 'a stunning property';
            const details = document.getElementById('details').value || 'spacious living';
            const features = document.getElementById('features').value || 'amazing views';

            generateBtn.innerText = "Generating with AI...";
            generateBtn.style.opacity = "0.7";

            try {
                // Send request to your Node.js backend
                const response = await fetch('https://studious-space-funicular-wv4554v7v9vghgqxw-3000.app.github.dev/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Write a real estate listing for a property at ${address}. It has ${details}. Key features include ${features}. Make it sound professional and appealing.`
                    })
                });

                const data = await response.json();

                if (data.result) {
                    outputBox.style.display = "block";
                    outputBox.innerHTML = `
                        <strong style="color: var(--accent); margin-bottom: 8px; display: block;">AI Generated Listing:</strong>
                        ${data.result}
                    `;
                } else {
                    alert("Error from AI: " + data.error);
                }
            } catch (error) {
                console.error(error);
                alert("Failed to connect to the backend server.");
            } finally {
                generateBtn.innerText = "Generate Listing";
                generateBtn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AgentCopilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon"><i data-lucide="home"></i></div>
                <span class="logo-text">AgentCopilot</span>
            </div>
            <nav class="nav-menu">
                <a href="./index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="./leads.html" class="nav-item"><i data-lucide="users"></i> CRM Leads</a>
                <a href="./ai-tools.html" class="nav-item"><i data-lucide="sparkles"></i> AI Tools</a>
                <a href="./admin.html" class="nav-item active"><i data-lucide="shield-check"></i> Admin Panel</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="menu-toggle"><i data-lucide="menu"></i></div>
                <div class="user-profile">
                    <i data-lucide="bell" class="notification-icon"></i>
                    <div class="avatar">JE</div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="welcome-section">
                    <p class="date">ADMIN PANEL</p>
                    <h1>All Users</h1>
                    <p class="subtitle">Everyone with access to this workspace and their role.</p>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="font-medium">Jordan Ellis</td>
                                <td class="text-muted">jordan@agentcopilot.app</td>
                                <td><span class="badge status-viewing">OWNER</span></td>
                            </tr>
                            <tr>
                                <td class="font-medium">Taylor Brooks</td>
                                <td class="text-muted">taylor.brooks@agentcopilot.app</td>
                                <td><span class="badge status-contacted">ADMIN</span></td>
                            </tr>
                            <tr>
                                <td class="font-medium">Noah Kim</td>
                                <td class="text-muted">noah.kim@agentcopilot.app</td>
                                <td><span class="badge status-new">AGENT</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
    <!-- Keep this to load icons -->
    <script>lucide.createIcons();</script>
    <!-- Add this to make the menu work -->
    <script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgentCopilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; }
        .login-box { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { margin-bottom: 8px; }
        .login-box p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }
        .login-box input, .login-box select { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; background: #09090B; border: 1px solid #27272A; color: white; }
        .login-box button { width: 100%; padding: 12px; border-radius: 8px; background: var(--accent); color: black; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
        .login-box button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>AgentCopilot</h2>
            <p>Create your workspace</p>
            <form id="register-form">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email address" required>
                <select id="country" autocomplete="country-name" required aria-label="Country"><option value="">Select your country</option></select>
                <input type="password" id="password" placeholder="Password (min 6 chars)" required>
                <button type="submit" id="register-btn">Create Account</button>
            </form>
            <p id="error-msg" style="color: #F43F5E; margin-top: 16px; display: none;"></p>
            <!-- LINK TO LOGIN -->
            <p style="margin-top: 24px; font-size: 0.8rem;">
                Already have an account? <a href="./login.html" style="color: var(--accent);">Sign in</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDWexZIGRtfkw5unI1jsGzcBS8Ind-dP8",
            authDomain: "agentcopilot-98817.firebaseapp.com",
            projectId: "agentcopilot-98817",
            storageBucket: "agentcopilot-98817.firebasestorage.app",
            messagingSenderId: "1061657518684",
            appId: "1:1061657518684:web:5db7baa214b1d2da08fc99"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ISO 3166-1 country list; stored as a readable name plus a stable country code.
        const countries = [
          ["AF","Afghanistan"],["AL","Albania"],["DZ","Algeria"],["AD","Andorra"],["AO","Angola"],["AG","Antigua and Barbuda"],["AR","Argentina"],["AM","Armenia"],["AU","Australia"],["AT","Austria"],["AZ","Azerbaijan"],["BS","Bahamas"],["BH","Bahrain"],["BD","Bangladesh"],["BB","Barbados"],["BY","Belarus"],["BE","Belgium"],["BZ","Belize"],["BJ","Benin"],["BT","Bhutan"],["BO","Bolivia"],["BA","Bosnia and Herzegovina"],["BW","Botswana"],["BR","Brazil"],["BN","Brunei"],["BG","Bulgaria"],["BF","Burkina Faso"],["BI","Burundi"],["CV","Cabo Verde"],["KH","Cambodia"],["CM","Cameroon"],["CA","Canada"],["CF","Central African Republic"],["TD","Chad"],["CL","Chile"],["CN","China"],["CO","Colombia"],["KM","Comoros"],["CG","Congo"],["CD","Congo (Democratic Republic)"],["CR","Costa Rica"],["CI","Côte d’Ivoire"],["HR","Croatia"],["CU","Cuba"],["CY","Cyprus"],["CZ","Czechia"],["DK","Denmark"],["DJ","Djibouti"],["DM","Dominica"],["DO","Dominican Republic"],["EC","Ecuador"],["EG","Egypt"],["SV","El Salvador"],["GQ","Equatorial Guinea"],["ER","Eritrea"],["EE","Estonia"],["SZ","Eswatini"],["ET","Ethiopia"],["FJ","Fiji"],["FI","Finland"],["FR","France"],["GA","Gabon"],["GM","Gambia"],["GE","Georgia"],["DE","Germany"],["GH","Ghana"],["GR","Greece"],["GD","Grenada"],["GT","Guatemala"],["GN","Guinea"],["GW","Guinea-Bissau"],["GY","Guyana"],["HT","Haiti"],["HN","Honduras"],["HU","Hungary"],["IS","Iceland"],["IN","India"],["ID","Indonesia"],["IR","Iran"],["IQ","Iraq"],["IE","Ireland"],["IL","Israel"],["IT","Italy"],["JM","Jamaica"],["JP","Japan"],["JO","Jordan"],["KZ","Kazakhstan"],["KE","Kenya"],["KI","Kiribati"],["KP","North Korea"],["KR","South Korea"],["KW","Kuwait"],["KG","Kyrgyzstan"],["LA","Laos"],["LV","Latvia"],["LB","Lebanon"],["LS","Lesotho"],["LR","Liberia"],["LY","Libya"],["LI","Liechtenstein"],["LT","Lithuania"],["LU","Luxembourg"],["MG","Madagascar"],["MW","Malawi"],["MY","Malaysia"],["MV","Maldives"],["ML","Mali"],["MT","Malta"],["MH","Marshall Islands"],["MR","Mauritania"],["MU","Mauritius"],["MX","Mexico"],["FM","Micronesia"],["MD","Moldova"],["MC","Monaco"],["MN","Mongolia"],["ME","Montenegro"],["MA","Morocco"],["MZ","Mozambique"],["MM","Myanmar"],["NA","Namibia"],["NR","Nauru"],["NP","Nepal"],["NL","Netherlands"],["NZ","New Zealand"],["NI","Nicaragua"],["NE","Niger"],["NG","Nigeria"],["MK","North Macedonia"],["NO","Norway"],["OM","Oman"],["PK","Pakistan"],["PW","Palau"],["PS","Palestine"],["PA","Panama"],["PG","Papua New Guinea"],["PY","Paraguay"],["PE","Peru"],["PH","Philippines"],["PL","Poland"],["PT","Portugal"],["QA","Qatar"],["RO","Romania"],["RU","Russia"],["RW","Rwanda"],["KN","Saint Kitts and Nevis"],["LC","Saint Lucia"],["VC","Saint Vincent and the Grenadines"],["WS","Samoa"],["SM","San Marino"],["ST","Sao Tome and Principe"],["SA","Saudi Arabia"],["SN","Senegal"],["RS","Serbia"],["SC","Seychelles"],["SL","Sierra Leone"],["SG","Singapore"],["SK","Slovakia"],["SI","Slovenia"],["SB","Solomon Islands"],["SO","Somalia"],["ZA","South Africa"],["SS","South Sudan"],["ES","Spain"],["LK","Sri Lanka"],["SD","Sudan"],["SR","Suriname"],["SE","Sweden"],["CH","Switzerland"],["SY","Syria"],["TW","Taiwan"],["TJ","Tajikistan"],["TZ","Tanzania"],["TH","Thailand"],["TL","Timor-Leste"],["TG","Togo"],["TO","Tonga"],["TT","Trinidad and Tobago"],["TN","Tunisia"],["TR","Türkiye"],["TM","Turkmenistan"],["TV","Tuvalu"],["UG","Uganda"],["UA","Ukraine"],["AE","United Arab Emirates"],["GB","United Kingdom"],["US","United States"],["UY","Uruguay"],["UZ","Uzbekistan"],["VU","Vanuatu"],["VA","Vatican City"],["VE","Venezuela"],["VN","Vietnam"],["YE","Yemen"],["ZM","Zambia"],["ZW","Zimbabwe"]
        ];
        const countrySelect = document.getElementById("country");
        countries.sort((a,b) => a[1].localeCompare(b[1]));
        countries.forEach(([code,name]) => { const option=document.createElement("option"); option.value=name; option.textContent=name; option.dataset.code=code; countrySelect.appendChild(option); });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const countrySelect = document.getElementById('country');
            const country = countrySelect.value;
            const countryCode = countrySelect.selectedOptions[0]?.dataset.code || "";
            if (!country || !countryCode) { errorMsg.innerText = "Please select your country."; errorMsg.style.display = "block"; return; }
            const btn = document.getElementById('register-btn');
            const errorMsg = document.getElementById('error-msg');

            btn.innerText = "Creating...";
            errorMsg.style.display = "none";

            try {
                // 1. Create user in Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Save user data to Firestore Database (matching your screenshot!)
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    country: country,
                    countryCode: countryCode,
                    role: "user",
                    createdAt: new Date().toISOString()
                });

                // 3. Redirect to dashboard
                window.location.href = "./index.html";
            } catch (error) {
                btn.innerText = "Create Account";
                errorMsg.innerText = error.message;
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
